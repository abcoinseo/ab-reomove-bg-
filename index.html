<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Studio Background Remover</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 20px;
            font-size: 24px;
            border-bottom: 2px solid #444;
            background: #111;
        }
        header .points-section {
            display: flex;
            align-items: center;
        }
        header .points-section span {
            margin-right: 20px;
            font-size: 18px;
        }
        header .upload-button {
            display: inline-flex;
            align-items: center;
            background: #222;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        header .upload-button:hover {
            background: #444;
        }
        header .upload-button .material-icons {
            margin-right: 10px;
        }
        .upload-section {
            margin-top: 20px;
            text-align: center;
        }
        .upload-button {
            display: inline-flex;
            align-items: center;
            background: #222;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .upload-button:hover {
            background: #444;
        }
        .upload-button .material-icons {
            margin-right: 10px;
        }
        .preview-box {
            margin: 20px 0;
            display: none;
            text-align: center;
        }
        .preview-box img {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid #444;
            border-radius: 10px;
        }
        .custom-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        .custom-popup button {
            background: #444;
            border: none;
            color: #fff;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .custom-popup button:hover {
            background: #555;
        }
        footer {
            text-align: center;
            padding: 20px;
            border-top: 2px solid #444;
            width: 100%;
        }
        footer a {
            color: #0aaff1;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div>AB Studio</div>
        <div class="points-section">
            <span id="point-display">Points: 100,000</span>
            <button id="ad-button" class="upload-button">
                <span class="material-icons">monetization_on</span> Earn Points
            </button>
        </div>
    </header>
    <div class="upload-section">
        <button class="upload-button" id="upload-btn">
            <span class="material-icons">upload</span> Upload Image
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
    </div>
    <div class="preview-box" id="preview-box">
        <p>Preview:</p>
        <img id="preview-image" src="" alt="Image Preview">
        <button class="upload-button" id="download-btn">
            <span class="material-icons">download</span> Download Image
        </button>
    </div>
    <footer>
        Powered By <a href="https://example.com" target="_blank">AB Studio</a>
    </footer>
    <div class="custom-popup" id="popup" style="display: none;">
        <p id="popup-message"></p>
        <button onclick="closePopup()">Close</button>
    </div>
    <script>
        const pointsKey = 'ab_studio_points';
        let points = localStorage.getItem(pointsKey) || 100000;
        points = Math.min(points, 100000);

        function updatePointsDisplay() {
            document.getElementById('point-display').innerText = `Points: ${points}`;
        }

        function showPopup(message) {
            const popup = document.getElementById('popup');
            const popupMessage = document.getElementById('popup-message');
            popupMessage.innerText = message;
            popup.style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        updatePointsDisplay();

        document.getElementById('ad-button').addEventListener('click', () => {
            show_8784875().then(() => {
                const earnedPoints = Math.floor(Math.random() * (500 - 100 + 1)) + 100;
                points = Math.min(points + earnedPoints, 100000);
                localStorage.setItem(pointsKey, points);
                updatePointsDisplay();
                showPopup(`You earned ${earnedPoints} points!`);
            });
        });

        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (file && points >= 100) {
                points -= 100;
                localStorage.setItem(pointsKey, points);
                updatePointsDisplay();

                const formData = new FormData();
                formData.append('image_file', file);

                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': 'pRzLVeYL51DhWRz8hAssDCVV'
                    },
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const previewUrl = URL.createObjectURL(blob);
                    const previewImage = document.getElementById('preview-image');
                    previewImage.src = previewUrl;
                    document.getElementById('preview-box').style.display = 'block';

                    document.getElementById('download-btn').onclick = () => {
                        const link = document.createElement('a');
                        link.href = previewUrl;
                        link.download = 'image.png';
                        link.click();
                    };
                } else {
                    showPopup('Failed to remove background. Please try again.');
                }
            } else {
                showPopup('Not enough points to remove the background!');
            }
        });
    </script>
    <script src='//niphaumeenses.net/vignette.min.js' data-zone='8784875' data-sdk='show_8784875'></script>
</body>
</html>
